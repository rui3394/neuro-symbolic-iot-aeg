name: toy_02_filter_chars
binary: datasets/toy_cgi/build/toy_02
arch: auto

http:
  method: GET
  path: /cgi-bin/ping
  params:
    ip:
      source: true
      max_len: 32

analysis:
  vulnerability_type: command_path_observation
  sinks:
    - system
    - snprintf
  sanitizers:
    - sanitizer_id: sanitizer_1:semicolon_blacklist
      type: blacklist
      source: ip
      chars:
        - ";"
      description: rejects semicolon before command formatting

mode:
  dry_run: true
