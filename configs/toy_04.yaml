name: toy_04_branch_check
binary: datasets/toy_cgi/build/toy_04
arch: auto

http:
  method: GET
  path: /cgi-bin/ping
  params:
    ip:
      source: true
      max_len: 32

analysis:
  vulnerability_type: command_path_observation
  expected_behavior: unsat_expected
  branch_condition:
    source: ip
    required_prefix: AB
    description: benign marker rule candidates do not satisfy this branch guard
  sinks:
    - system
    - snprintf

mode:
  dry_run: true
