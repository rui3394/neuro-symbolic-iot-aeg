name: toy_05_safe_case
binary: datasets/toy_cgi/build/toy_05
arch: auto

http:
  method: GET
  path: /cgi-bin/ping
  params:
    ip:
      source: true
      max_len: 32

analysis:
  vulnerability_type: safe_path_observation
  expected_behavior: unsat_expected
  safe_negative:
    description: system is reachable with a fixed benign command, but source/marker are not included in the sink argument
  sinks:
    - system
    - snprintf

mode:
  dry_run: true
