name: toy_03_length_limit
binary: datasets/toy_cgi/build/toy_03
arch: auto

http:
  method: GET
  path: /cgi-bin/ping
  params:
    ip:
      source: true
      max_len: 32

analysis:
  vulnerability_type: command_path_observation
  sinks:
    - system
    - snprintf
  sanitizers:
    - sanitizer_id: sanitizer_1:length_window
      type: length_window
      source: ip
      max_prefix_len: 16
      requires_nul_within: 16
      description: requires input NUL terminator within the first 16 bytes

mode:
  dry_run: true
